<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13348f">
<title>Trainingsplan SV Westfalia Rhynern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<!--
  ============================================================
  EINRICHTUNG
  Datenquelle und Links stehen in config.js.
  Ansicht erzwingen: Adresse mit #mobil oder #desktop aufrufen.
  ============================================================
-->
<style>
/* Layout: Handy = schlanke Liste mit kompakter Kopfleiste. Browser = Wochenmatrix
   (Plätze x Tage) wie die bisherige Excel-Liste, füllt das ganze Fenster. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --line:#dde2ec; --line-2:#c9d1e0;
  --fg:#141a2b; --muted:#5b6478; --navy:#13348f; --navy-2:#0f2a75; --navy-ink:#ffffff;
  --accent:#1f4fd6; --warn:#b4530b; --off:#b3261e; --off-bg:#fde9e7; --chip:#e3e8f3; --now:#e0262f;
  --today:#e8eefc;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1120; --surface:#141b2d; --surface-2:#1a2238; --line:#252f4a; --line-2:#323e5e;
  --fg:#e8ecf6; --muted:#9aa4bd; --navy:#183690; --navy-2:#122a70; --navy-ink:#ffffff;
  --accent:#7ea2ff; --warn:#ffb36b; --off:#ff8a80; --off-bg:#3b1715; --chip:#232d48; --now:#ff5a62;
  --today:#1b2645; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1120; --surface:#141b2d; --surface-2:#1a2238; --line:#252f4a; --line-2:#323e5e;
  --fg:#e8ecf6; --muted:#9aa4bd; --navy:#183690; --navy-2:#122a70; --navy-ink:#ffffff;
  --accent:#7ea2ff; --warn:#ffb36b; --off:#ff8a80; --off-bg:#3b1715; --chip:#232d48; --now:#ff5a62;
  --today:#1b2645; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
#app{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.tag{display:inline-block;font:700 14px/1 var(--display);letter-spacing:.03em;padding:4px 7px;border-radius:5px;white-space:nowrap}
.flag{font:600 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:3px 5px;border-radius:4px;white-space:nowrap}
.flag.off{background:var(--off-bg);color:var(--off)}
.flag.warn{border:1px solid var(--warn);color:var(--warn)}
.status{font-size:13px;color:var(--muted);text-align:center;margin:12px 16px}
.status.err{color:var(--off)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font:700 20px/1 var(--display);text-transform:uppercase;margin:0}
.sheet textarea{width:100%;min-height:220px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:10px;font:14px/1.4 var(--body);color:var(--fg)}
.btn{height:36px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;align-self:flex-end}

/* ================= MOBIL ================= */
.m-top{position:sticky;top:0;z-index:5;background:var(--navy);color:var(--navy-ink);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;flex-direction:column;gap:8px}
.m-row{display:flex;align-items:center;gap:8px}
.m-title{flex:1;min-width:0}
.m-title b{display:block;font:700 19px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.m-title small{display:block;font-size:12px;opacity:.8;font-variant-numeric:tabular-nums;margin-top:2px}
.m-nav{background:rgba(255,255,255,.14);border:0;color:inherit;width:32px;height:32px;border-radius:8px;font-size:17px;display:grid;place-items:center;flex:none}
.m-nav:disabled{opacity:.3;cursor:default}
.m-days{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.m-day{border:0;border-radius:8px;background:rgba(255,255,255,.1);color:inherit;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;position:relative}
.m-day b{font:700 15px/1 var(--display);text-transform:uppercase}
.m-day small{font-size:10px;opacity:.75;font-variant-numeric:tabular-nums;margin-top:1px}
.m-day[aria-pressed="true"]{background:var(--navy-ink);color:var(--navy)}
.m-day .dot{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--now)}
.m-tools{display:flex;gap:6px}
.m-tools select{flex:1;min-width:0;height:34px;border-radius:8px;border:0;background:rgba(255,255,255,.14);color:inherit;padding:0 8px;font-size:14px}
.m-tools select option{color:#141a2b;background:#fff}
.m-tools button{height:34px;border-radius:8px;border:0;background:rgba(255,255,255,.14);color:inherit;padding:0 10px;font-size:13px;font-weight:600}
.m-body{padding-inline:12px;padding-block:6px 32px}
.m-head{display:flex;justify-content:space-between;align-items:baseline;padding:8px 2px 4px}
.m-head h2{margin:0;font:700 17px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.m-head span{font-size:12px;color:var(--muted)}
.m-pitch{border-top:1px solid var(--line);padding:8px 2px 6px}
.m-pname{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.m-pname .closed{color:var(--off)}
.m-list{list-style:none;margin:0;padding:0}
.m-item{display:grid;grid-template-columns:66px auto 1fr;gap:8px;align-items:center;padding:4px 0;min-width:0}
.m-time{font:600 16px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.m-time small{font:500 11px var(--body);color:var(--muted)}
.m-meta{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12px;color:var(--muted);min-width:0}
.m-item.off .m-time,.m-item.off .tag{text-decoration:line-through;opacity:.55}
.m-none{font-size:13px;color:var(--muted);padding:2px 0}
.m-agenda .m-pitch{display:grid;grid-template-columns:44px 1fr;gap:8px}
.m-agenda .m-dn{font:700 16px/1.1 var(--display);text-transform:uppercase}
.m-agenda .m-dn small{display:block;font:500 11px var(--body);color:var(--muted)}
.m-ag-item{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:2px 0}
.m-foot{font-size:11px;color:var(--muted);text-align:center;padding:16px 12px 8px;display:flex;flex-direction:column;gap:6px}
.m-foot a{color:var(--accent)}

/* ================= DESKTOP ================= */
.d-app{height:100%;display:grid;grid-template-rows:auto 1fr auto;font-size:clamp(13px,0.95vw,22px)}
.d-top{background:var(--navy);color:var(--navy-ink);display:flex;align-items:center;gap:1.4em;padding:.7em 1.4em}
.d-brand small{display:block;font:600 .8em/1 var(--display);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.d-brand b{display:block;font:700 2em/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin-top:.15em}
.d-week{display:flex;align-items:center;gap:.6em;margin-left:auto}
.d-week .range{font:600 1.5em/1 var(--display);font-variant-numeric:tabular-nums;min-width:11em;text-align:center}
.d-week button{background:rgba(255,255,255,.14);border:0;color:inherit;width:2.2em;height:2.2em;border-radius:.4em;font-size:1em}
.d-week button:disabled{opacity:.3;cursor:default}
.d-week .today-btn{width:auto;padding:0 .8em;font-weight:600}
.d-tools{display:flex;align-items:center;gap:.6em}
.d-tools select{height:2.3em;border-radius:.4em;border:0;background:rgba(255,255,255,.14);color:inherit;padding:0 .6em;font-size:1em}
.d-tools select option{color:#141a2b;background:#fff}
.d-stand{font-size:.85em;opacity:.8;text-align:right;white-space:nowrap}
.d-grid{display:grid;grid-template-columns:minmax(9em,11%) repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border-block:1px solid var(--line);min-height:0;overflow:auto}
.d-grid > div{background:var(--surface);min-width:0}
.d-corner{background:var(--surface-2)!important}
.d-dh{background:var(--surface-2)!important;position:sticky;top:0;z-index:1;padding:.55em .8em;display:flex;align-items:baseline;gap:.5em}
.d-dh b{font:700 1.45em/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.d-dh small{color:var(--muted);font-variant-numeric:tabular-nums}
.d-dh.is-today{background:var(--navy)!important;color:var(--navy-ink)}
.d-dh.is-today small{color:inherit;opacity:.8}
.d-ph{background:var(--surface-2)!important;padding:.6em .8em;display:flex;flex-direction:column;justify-content:center;gap:.2em}
.d-ph b{font:700 1.2em/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em}
.d-ph small{color:var(--muted);font-size:.8em;line-height:1.25}
.d-cell{padding:.45em;display:flex;flex-direction:column;gap:.3em}
.d-cell.is-today{background:var(--today)!important}
.d-slot{display:flex;align-items:center;gap:.5em;border-radius:.35em;padding:.38em .55em;min-width:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.d-slot b{font:700 1.2em/1 var(--display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-slot span{margin-left:auto;font:600 1.1em/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.d-slot i{font-style:normal;font-size:.85em;opacity:.85}
.d-slot.off{background:repeating-linear-gradient(135deg,var(--off-bg) 0 6px,var(--surface) 6px 12px)!important;color:var(--off)!important;text-decoration:line-through}
.d-slot.warn{box-shadow:inset 0 0 0 2px var(--warn)}
.d-slot.dim{opacity:.18}
.d-slot .note{flex-basis:100%;font:500 .8em/1.2 var(--body);text-decoration:none}
.d-slot.has-note{flex-wrap:wrap}
.d-fill{flex:1;min-height:2.4em;border-radius:.35em;display:grid;place-items:center;font:600 1.05em/1 var(--display);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:.4em}
.d-fill.closed{background:repeating-linear-gradient(135deg,var(--off-bg) 0 8px,transparent 8px 16px);color:var(--off)}
.d-fill.req{background:repeating-linear-gradient(135deg,var(--chip) 0 8px,transparent 8px 16px);color:var(--muted)}
.d-foot{display:flex;gap:1.5em;align-items:center;padding:.5em 1.4em;font-size:.85em;color:var(--muted);flex-wrap:wrap}
.d-foot .sw{display:inline-block;width:1.2em;height:.8em;border-radius:.2em;vertical-align:-.05em;margin-right:.4em}
.d-foot a{color:var(--accent)}
.d-foot .right{margin-left:auto;display:flex;gap:1.2em}
.d-foot button{background:none;border:0;color:var(--accent);padding:0;font-size:1em;text-decoration:underline}
@media print{.d-top button,.d-tools{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script src="config.js?v=4"></script>
<script src="core.js?v=4"></script>
<script>
let plan = {weeks:{}}; let loadedAt = null; let updatedAt = null;
let state = {week:null, day:0, team:""};
let mode = null;
const W = () => plan.weeks[state.week];
const weekKeys = () => Object.keys(plan.weeks).sort();
const allTeams = () => [...new Set(Object.values(plan.weeks).flatMap(x=>x.slots.map(s=>s.team)))].sort(teamSort);

function pickWeek(){
  const key = currentWeekKey(); const keys = weekKeys();
  if (plan.weeks[key]) return key;
  const past = keys.filter(k => k <= key); return past.length ? past[past.length-1] : keys[0];
}
function pickDay(){
  const now = new Date(); const d = (now.getDay()+6)%7;
  return (isoDate(mondayOf(now))===state.week && d<5) ? d : 0;
}
const todayIndex = () => { const now = new Date(); const d=(now.getDay()+6)%7; return isoDate(mondayOf(now))===state.week && d<5 ? d : -1; };
function stepWeek(dir){ const k = weekKeys(); const i = k.indexOf(state.week)+dir; if (i>=0 && i<k.length){ state.week = k[i]; render(); } }
function setTeam(t){ state.team = t; store.set("pp-team", t); render(); }
function standText(){ const t = updatedAt || loadedAt; if (!t) return ""; const sameDay = isoDate(t)===isoDate(new Date()); return `Stand ${sameDay ? "" : dm(t)+" "}${pad(t.getHours())}:${pad(t.getMinutes())} Uhr`; }

/* ---------- WhatsApp text ---------- */
function planText(){
  const w = W(); const mon = parseISO(state.week);
  const sh = s => s.share ? ` (${SHARE_SHORT[s.share]})` : "";
  if (state.team){
    const out = [`*${state.team} – Training ${dm(mon)}–${dm(addDays(mon,4))}*`];
    for (let d=0; d<5; d++) for (const s of w.slots.filter(x=>x.team===state.team && x.d===d).sort(byTime))
      out.push(`${DSHORT[d]} ${dm(addDays(mon,d))}: ${startLabel(s)}, ${pitch(s.p).name}${s.off?" – ABGESAGT":""}`);
    return out.join("\n");
  }
  const d = state.day; const out = [`*Platzbelegung ${DAYS[d]}, ${dm(addDays(mon,d))}*`];
  for (const p of PITCHES){
    const ps = w.slots.filter(s=>s.p===p.id && s.d===d).sort(byTime);
    const closed = w.closed[`${p.id}-${d}`];
    if (!ps.length && !closed && !p.request) continue;
    out.push(`\n_${p.name}_` + (closed ? ` – ${closed}` : p.request && !ps.length ? " – nach Rücksprache" : ""));
    ps.forEach(s=>out.push(`${startLabel(s)} ${s.team}${sh(s)}${s.off?" – ABGESAGT":""}${s.note?" – "+s.note:""}`));
  }
  return out.join("\n");
}
async function copyText(){
  const txt = planText();
  try { await navigator.clipboard.writeText(txt); toast("Text kopiert – in WhatsApp einfügen"); }
  catch {
    const ta = el("textarea",{id:"copyArea"}); ta.value = txt;
    const close = () => $("#sheetHost").replaceChildren();
    $("#sheetHost").replaceChildren(el("div",{class:"scrim",onclick:e=>{ if(e.target===e.currentTarget) close(); }},
      el("div",{class:"sheet"}, el("h3",{},"Text markieren und kopieren"), ta, el("button",{class:"btn primary",onclick:close},"Schließen"))));
    ta.focus(); ta.select();
  }
}

/* ---------- mode ---------- */
const mq = window.matchMedia("(min-width: 1000px)");
function decideMode(){
  const h = location.hash.replace("#","");
  if (h === "desktop") return "desktop";
  if (h === "mobil" || h === "mobile") return "mobile";
  return mq.matches ? "desktop" : "mobile";
}
function switchTo(m){ location.hash = m === "desktop" ? "desktop" : "mobil"; }

/* ---------- render ---------- */
function render(){
  mode = decideMode();
  const app = $("#app");
  if (!state.week || !W()) return;
  app.replaceChildren(mode === "desktop" ? desktopView() : mobileView());
}

/* ===== mobile ===== */
function mobileView(){
  const w = W(); const mon = parseISO(state.week); const keys = weekKeys(); const i = keys.indexOf(state.week);
  const today = todayIndex();
  const sel = el("select",{id:"m-team","aria-label":"Mannschaft wählen",onchange:e=>setTeam(e.target.value)},
    el("option",{value:""},"Alle Mannschaften"), ...allTeams().map(t=>el("option",{value:t},`${t} – meine Woche`)));
  sel.value = state.team;

  const top = el("header",{class:"m-top"},
    el("div",{class:"m-row"},
      el("button",{class:"m-nav","aria-label":"Vorige Woche",disabled:i<=0,onclick:()=>stepWeek(-1)},"‹"),
      el("div",{class:"m-title"}, el("b",{},"SVW Trainingsplan"), el("small",{},`${dm(mon)} – ${dm(addDays(mon,4))}${addDays(mon,4).getFullYear()} · ${standText()}`)),
      el("button",{class:"m-nav","aria-label":"Nächste Woche",disabled:i>=keys.length-1,onclick:()=>stepWeek(1)},"›")),
    state.team ? null : el("div",{class:"m-days",role:"group","aria-label":"Wochentag"}, ...DSHORT.map((n,d)=>
      el("button",{class:"m-day","aria-pressed":String(state.day===d),onclick:()=>{state.day=d;render();}},
        d===today ? el("span",{class:"dot","aria-label":"heute"}) : null, el("b",{},n), el("small",{},dm(addDays(mon,d)))))),
    el("div",{class:"m-tools"}, sel, el("button",{onclick:copyText,"aria-label":"Als Text für WhatsApp kopieren"},"Text kopieren")));

  const body = el("main",{class:"m-body"});
  const bad = conflicts(w.slots);
  if (state.team) body.append(...mobileTeam(w, mon, bad));
  else body.append(...mobileDay(w, mon, bad));

  const foot = el("footer",{class:"m-foot"}, FOOTER,
    el("span",{}, el("a",{href:"#desktop",onclick:e=>{e.preventDefault();switchTo("desktop");}},"Zur Wochenübersicht (Desktop)"),
      CFG.EDIT_URL ? [" · ", el("a",{href:CFG.EDIT_URL,target:"_blank",rel:"noopener"},"Plan bearbeiten")] : null));
  return el("div",{}, top, body, foot);
}
function mobileDay(w, mon, bad){
  const d = state.day; const slots = w.slots.filter(s=>s.d===d);
  const out = [el("div",{class:"m-head"}, el("h2",{},`${DAYS[d]}, ${dm(addDays(mon,d))}`), el("span",{},`${slots.filter(s=>!s.off).length} Trainings`))];
  for (const p of PITCHES){
    const ps = slots.filter(s=>s.p===p.id).sort(byTime); const closed = w.closed[`${p.id}-${d}`];
    const sec = el("section",{class:"m-pitch"},
      el("div",{class:"m-pname"}, el("span",{},p.name),
        closed ? el("span",{class:"closed"},closed) : (p.request && !ps.length) ? el("span",{},"nach Rücksprache") : null));
    if (ps.length){
      const ul = el("ul",{class:"m-list"});
      for (const s of ps){
        const meta = el("div",{class:"m-meta"});
        if (s.share) meta.append(el("span",{},SHARE_LABEL[s.share]));
        if (s.note) meta.append(el("span",{},s.note));
        if (s.off) meta.append(el("span",{class:"flag off"},"Abgesagt"));
        if (bad.has(s.id)) meta.append(el("span",{class:"flag warn"},"Überschneidung"));
        ul.append(el("li",{class:"m-item"+(s.off?" off":"")},
          el("div",{class:"m-time"}, s.ab ? [el("small",{},"ab "), s.t] : s.t),
          el("button",{style:"border:0;background:none;padding:0","aria-label":`Woche von ${s.team} anzeigen`,onclick:()=>{setTeam(s.team);scrollTo(0,0);}}, teamTag(s.team)),
          meta));
      }
      sec.append(ul);
    } else if (!closed && !p.request) sec.append(el("div",{class:"m-none"},"frei"));
    out.push(sec);
  }
  return out;
}
function mobileTeam(w, mon, bad){
  const t = state.team; const mine = w.slots.filter(s=>s.team===t);
  const wrap = el("div",{class:"m-agenda"});
  for (let d=0; d<5; d++){
    const ds = mine.filter(s=>s.d===d).sort(byTime);
    const col = el("div",{});
    if (!ds.length) col.append(el("div",{class:"m-none"},"kein Training"));
    for (const s of ds){
      const it = el("div",{class:"m-ag-item"},
        el("span",{class:"m-time",style:s.off?"text-decoration:line-through;opacity:.55":""}, startLabel(s)),
        el("span",{}, pitch(s.p).name + (s.share ? ` (${SHARE_SHORT[s.share]})` : "")));
      if (s.note) it.append(el("span",{class:"m-meta"},s.note));
      if (s.off) it.append(el("span",{class:"flag off"},"Abgesagt"));
      if (w.closed[`${s.p}-${d}`]) it.append(el("span",{class:"flag off"},"Platz gesperrt"));
      if (bad.has(s.id)) it.append(el("span",{class:"flag warn"},"Überschneidung"));
      col.append(it);
    }
    wrap.append(el("section",{class:"m-pitch"}, el("div",{class:"m-dn"},DSHORT[d], el("small",{},dm(addDays(mon,d)))), col));
  }
  return [el("div",{class:"m-head"}, el("h2",{}, teamTag(t), " Trainingswoche"), el("span",{},`${mine.filter(s=>!s.off).length} Einheiten`)), wrap];
}

/* ===== desktop ===== */
function desktopView(){
  const w = W(); const mon = parseISO(state.week); const keys = weekKeys(); const i = keys.indexOf(state.week);
  const today = todayIndex(); const bad = conflicts(w.slots); const cw = currentWeekKey();
  const sel = el("select",{id:"d-team","aria-label":"Mannschaft hervorheben",onchange:e=>setTeam(e.target.value)},
    el("option",{value:""},"Alle Mannschaften"), ...allTeams().map(t=>el("option",{value:t},`Nur ${t} hervorheben`)));
  sel.value = state.team;

  const top = el("header",{class:"d-top"},
    el("div",{class:"d-brand"}, el("small",{},"SV Westfalia Rhynern e.V."), el("b",{},"Trainingsplan")),
    el("div",{class:"d-week"},
      el("button",{"aria-label":"Vorige Woche",disabled:i<=0,onclick:()=>stepWeek(-1)},"‹"),
      el("div",{class:"range"}, `${dm(mon)} – ${dm(addDays(mon,4))}${addDays(mon,4).getFullYear()}`),
      el("button",{"aria-label":"Nächste Woche",disabled:i>=keys.length-1,onclick:()=>stepWeek(1)},"›"),
      (plan.weeks[cw] && state.week !== cw) ? el("button",{class:"today-btn",onclick:()=>{state.week=cw;render();}},"Diese Woche") : null),
    el("div",{class:"d-tools"}, sel),
    el("div",{class:"d-stand"}, standText()));

  const weight = p => Math.max(1, ...[0,1,2,3,4].map(d => w.slots.filter(s=>s.p===p.id && s.d===d).length));
  const grid = el("div",{class:"d-grid",style:`grid-template-rows:auto ${PITCHES.map(p=>`minmax(min-content,${weight(p)}fr)`).join(" ")}`});
  grid.append(el("div",{class:"d-corner"}));
  DAYS.forEach((n,d)=> grid.append(el("div",{class:"d-dh"+(d===today?" is-today":"")}, el("b",{},n), el("small",{},dm(addDays(mon,d))))));
  for (const p of PITCHES){
    grid.append(el("div",{class:"d-ph"}, el("b",{},p.name), el("small",{},p.area)));
    for (let d=0; d<5; d++){
      const cell = el("div",{class:"d-cell"+(d===today?" is-today":"")});
      const ps = w.slots.filter(s=>s.p===p.id && s.d===d).sort(byTime);
      const closed = w.closed[`${p.id}-${d}`];
      if (closed) cell.append(el("div",{class:"d-fill closed"},closed));
      else if (p.request && !ps.length) cell.append(el("div",{class:"d-fill req"},"nach Rücksprache"));
      for (const s of ps){
        const [bg,fg] = colorOf(s.team);
        const cls = "d-slot"+(s.off?" off":"")+(bad.has(s.id)?" warn":"")+(state.team && s.team!==state.team?" dim":"")+(s.note?" has-note":"");
        cell.append(el("div",{class:cls,style:`background:${bg};color:${fg}`,
          title:`${s.team} · ${startLabel(s)}${s.ab?"":"–"+fmt(toMin(s.t)+s.dur)} Uhr${s.share?" · "+SHARE_LABEL[s.share]:""}${s.off?" · abgesagt":""}${bad.has(s.id)?" · Überschneidung prüfen":""}`},
          el("b",{},s.team), s.share ? el("i",{},SHARE_SHORT[s.share]) : null, el("span",{}, startLabel(s)),
          s.note ? el("div",{class:"note"},s.note) : null));
      }
      grid.append(cell);
    }
  }

  const foot = el("footer",{class:"d-foot"},
    el("span",{}, el("i",{class:"sw",style:"background:repeating-linear-gradient(135deg,var(--off-bg) 0 3px,transparent 3px 6px);border:1px solid var(--off)"}),"gesperrt / abgesagt"),
    el("span",{}, el("i",{class:"sw",style:"border:2px solid var(--warn)"}),"Überschneidung prüfen"),
    el("span",{}, "¼ / ½ = Platzanteil"),
    el("span",{}, FOOTER),
    el("span",{class:"right"},
      CFG.EDIT_URL ? el("a",{href:CFG.EDIT_URL,target:"_blank",rel:"noopener"},"Plan bearbeiten") : null,
      el("button",{onclick:()=>switchTo("mobile")},"Mobilansicht")));
  return el("div",{class:"d-app"}, top, grid, foot);
}

/* ---------- loading ---------- */
function setStatus(msg){
  let s = $("#status");
  if (!msg){ if (s) s.remove(); return; }
  if (!s){ s = el("p",{id:"status",class:"status"}); document.body.prepend(s); }
  s.textContent = msg; s.className = "status" + (loadedAt ? " err" : (msg.includes("nicht") ? " err" : ""));
}
async function load(){
  try {
    const res = await loadPlanData();
    const fresh = res.plan;
    if (!Object.keys(fresh.weeks).length) throw new Error("keine Daten");
    updatedAt = res.updated;
    const keepWeek = state.week && fresh.weeks[state.week];
    plan = fresh; loadedAt = new Date();
    if (!keepWeek){ state.week = pickWeek(); state.day = pickDay(); }
    if (!allTeams().includes(state.team)) state.team = "";
    setStatus(""); render();
  } catch (e) {
    setStatus(loadedAt
      ? "Aktualisieren hat nicht geklappt. Angezeigt wird der zuletzt geladene Stand."
      : "Der Trainingsplan konnte nicht geladen werden. Bitte später erneut versuchen.");
  }
}

state.team = store.get("pp-team") || "";
setStatus("Trainingsplan wird geladen …");
load();
setInterval(load, 5*60*1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && loadedAt && Date.now()-loadedAt > 60000) load(); });
mq.addEventListener("change", render);
window.addEventListener("hashchange", render);
</script>
</body>
